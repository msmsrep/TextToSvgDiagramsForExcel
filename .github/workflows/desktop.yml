name: Desktop app

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "site/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The app's build runs "npm run build:engine" to bundle the engine into web/.
      - run: dotnet build desktop/TextToSvgDiagramsForExcel.Desktop.sln -c Release
      - run: dotnet test desktop/TextToSvgDiagramsForExcel.Desktop.sln -c Release --no-build

      # The development .msixbundle (design §9.2), only when the signing
      # certificate is configured as secrets (MSIX_CERT_BASE64, MSIX_CERT_PASSWORD).
      - name: Check for the signing certificate
        id: cert
        shell: pwsh
        env:
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
        run: |
          if ($env:MSIX_CERT_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'msix.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:MSIX_CERT_BASE64))
            "path=$path" >> $env:GITHUB_OUTPUT
          }
      # winapp CLI is in public preview; keep its version pinned.
      - if: steps.cert.outputs.path
        uses: microsoft/setup-WinAppCli@v0.2
        with:
          version: v0.7.1
      - if: steps.cert.outputs.path
        shell: pwsh
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: ./desktop/package/pack.ps1 -Variant Dev -CertPath "${{ steps.cert.outputs.path }}"
      - if: steps.cert.outputs.path
        uses: actions/upload-artifact@v5
        with:
          name: msixbundle-dev
          path: desktop/out/Dev/*.msixbundle
      - if: always() && steps.cert.outputs.path
        shell: pwsh
        run: Remove-Item "${{ steps.cert.outputs.path }}" -ErrorAction SilentlyContinue
