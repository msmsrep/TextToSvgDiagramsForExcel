<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text-to-SVG Diagrams for Excel</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <h1>Text-to-SVG Diagrams for Excel</h1>

    <label class="field-label" for="sheet-diagram-select">Sheet diagram</label>
    <select id="sheet-diagram-select" aria-label="Select Mermaid diagram in active sheet">
      <option value="">(No diagram selected)</option>
    </select>
    <div id="load-confirm" role="alert" hidden>
      <span id="load-confirm-text"></span>
      <div class="confirm-buttons">
        <button id="load-confirm-replace" class="action-btn">Replace</button>
        <button id="load-confirm-keep" class="secondary-btn">Keep</button>
      </div>
    </div>

    <label class="field-label" for="template-select">New from template</label>
    <div class="select-group">
      <!-- Options are filled from templates.ts. -->
      <select id="template-select" aria-label="Template"></select>
      <button id="template-btn" class="action-btn">Use</button>
    </div>

    <label class="field-label" for="table-kind-select">Code from selected cells</label>
    <div class="select-group">
      <select id="table-kind-select" aria-label="Diagram type to generate">
        <option value="auto">Auto</option>
        <option value="flowchart">Flowchart (parent | child | label)</option>
        <option value="gantt">Gantt (task | start | end or days | section)</option>
        <option value="pie">Pie (label | value)</option>
      </select>
      <button id="generate-btn" class="action-btn">Generate</button>
    </div>

    <div id="editor">
      <div id="input-backdrop" aria-hidden="true"></div>
      <textarea
        id="mermaid-input"
        aria-label="Mermaid code"
        spellcheck="false"
        placeholder="graph TD&#10;A-->B"
      >
graph LR
    A[Start] --> B{Condition}
    B -->|Yes| C[Process A]
    B -->|No| D[Process B]
    C --> E[End]
    D --> E</textarea
      >
    </div>
    <div
      id="splitter"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize editor"
      tabindex="0"
    ></div>

    <div class="size-group">
      <label class="field-label" for="size-select">Size</label>
      <select id="size-select" aria-label="Output size">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="width">Width (pt)</option>
      </select>
      <input id="size-width" type="number" min="1" step="1" aria-label="Width in points" hidden />
      <label class="check-label">
        <input id="keep-size" type="checkbox" checked disabled />
        Keep current size
      </label>
    </div>

    <div class="buttons">
      <div class="insert-group">
        <select id="format-select" aria-label="Output format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="svg">SVG</option>
          <option value="svg-office">SVG (for shape conversion)</option>
          <option value="shapes">Shapes (editable)</option>
        </select>
        <button id="insert-btn" class="action-btn" disabled>Insert to Excel</button>
      </div>
      <button id="download-btn" class="action-btn" disabled>Download</button>
    </div>

    <div id="error"></div>

    <div id="preview"></div>

    <script src="taskpane.js"></script>
  </body>
</html>
